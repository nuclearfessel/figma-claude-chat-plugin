<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude Bridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f5;
    --fg: #141413;
    --muted: #7a786f;
    --border: #e8e6dc;
    --ok: #788c5d;
    --err: #c0523d;
    --accent: #d97757;
    --accent-fg: #faf9f5;
    --bubble-user: rgba(217,119,87,0.14);
    --bubble-assistant: rgba(20,20,19,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --fg: #faf9f5;
      --muted: #b0aea5;
      --border: #2a2a27;
      --bubble-user: rgba(217,119,87,0.22);
      --bubble-assistant: rgba(250,249,245,0.07);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 12px;
    color: var(--fg);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #brand {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #brand svg { flex-shrink: 0; }
  header h1 {
    font-family: Poppins, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  #status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--err);
    flex-shrink: 0;
  }
  #status-dot.connected { background: var(--ok); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    padding: 8px 10px;
    border-radius: 8px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 92%;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
  }
  .bubble.tool {
    align-self: flex-start;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 10.5px;
  }
  .bubble.system {
    align-self: center;
    color: var(--muted);
    font-size: 10.5px;
    background: transparent;
  }
  .bubble.error {
    align-self: flex-start;
    color: var(--err);
    background: rgba(221,51,51,0.08);
  }
  .bubble.external {
    align-self: flex-start;
    background: rgba(106,155,204,0.12);
    border-left: 3px solid #6a9bcc;
  }
  .bubble.external .label {
    display: block;
    font-family: Poppins, Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #6a9bcc;
    margin-bottom: 2px;
  }
  #empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }
  #empty code {
    background: var(--bubble-user);
    color: var(--accent);
    padding: 1px 4px;
    border-radius: 4px;
  }

  #composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    height: 36px;
    max-height: 120px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 12px;
  }
  #composer button {
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    padding: 0 14px;
    font-family: Poppins, Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>

<header>
  <div id="brand">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 0L9.2 6.2 15 8L9.2 9.8 8 16L6.8 9.8 1 8L6.8 6.2Z" fill="var(--accent)" />
    </svg>
    <h1>Claude Bridge</h1>
  </div>
  <div id="status-badge">
    <span id="status-dot"></span>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div id="chat">
  <div id="empty">
    Chat with Claude about this file. It can see and edit the open Figma
    document via <code>figma_*</code> tools.
  </div>
</div>

<div id="composer">
  <textarea id="input" placeholder="Ask Claude…" rows="1"></textarea>
  <button id="send">Send</button>
</div>

<script>
(function () {
  const PORT = 8722;
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const chatEl = document.getElementById("chat");
  const emptyEl = document.getElementById("empty");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let ws = null;
  let reconnectTimer = null;
  let currentAssistantBubble = null;
  let waitingForReply = false;

  function bubble(kind, text, label) {
    emptyEl.style.display = "none";
    const el = document.createElement("div");
    el.className = "bubble " + kind;
    if (label) {
      const labelEl = document.createElement("span");
      labelEl.className = "label";
      labelEl.textContent = label;
      el.appendChild(labelEl);
    }
    el.appendChild(document.createTextNode(text));
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  function setStatus(connected, text) {
    statusDot.classList.toggle("connected", connected);
    statusText.textContent = text;
  }

  function setWaiting(waiting) {
    waitingForReply = waiting;
    sendBtn.disabled = waiting || !ws || ws.readyState !== WebSocket.OPEN;
  }

  function connect() {
    setStatus(false, "Connecting…");
    ws = new WebSocket("ws://localhost:" + PORT);

    ws.onopen = () => {
      setStatus(true, "Connected");
      setWaiting(waitingForReply);
    };

    ws.onclose = () => {
      setStatus(false, "Disconnected — retrying…");
      setWaiting(waitingForReply);
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      // onclose fires right after; the retry loop there is enough.
    };

    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }

      if (typeof msg.type === "string" && msg.type.startsWith("chat:")) {
        handleChatEvent(msg);
        return;
      }

      // Otherwise it's a figma_* command from an external `claude` CLI
      // session, relayed to the plugin sandbox for execution.
      parent.postMessage({ pluginMessage: msg }, "*");
    };
  }

  function handleChatEvent(msg) {
    switch (msg.type) {
      case "chat:started":
        break;
      case "chat:delta":
        if (!currentAssistantBubble) {
          currentAssistantBubble = bubble("assistant", "");
        }
        currentAssistantBubble.textContent += msg.text;
        chatEl.scrollTop = chatEl.scrollHeight;
        break;
      case "chat:message":
        // Full text block — use it if streaming deltas didn't already fill
        // the bubble (some turns arrive as one shot rather than deltas).
        if (!currentAssistantBubble) {
          currentAssistantBubble = bubble("assistant", msg.text);
        } else if (!currentAssistantBubble.textContent) {
          currentAssistantBubble.textContent = msg.text;
        }
        break;
      case "chat:tool":
        bubble("tool", "🔧 " + msg.name + (msg.input ? " " + JSON.stringify(msg.input) : ""));
        break;
      case "chat:external":
        // A message pushed in from a separate Claude Code session (terminal,
        // Claude Desktop, etc.) via the figma_send_message tool — distinct
        // from the embedded assistant's own replies.
        bubble("external", msg.text, "Claude Code");
        break;
      case "chat:done":
        currentAssistantBubble = null;
        setWaiting(false);
        break;
      case "chat:log":
        break;
      case "chat:closed":
        bubble("system", "Chat session ended.");
        currentAssistantBubble = null;
        setWaiting(false);
        break;
      case "chat:error":
        bubble("error", "✕ " + msg.message);
        currentAssistantBubble = null;
        setWaiting(false);
        break;
      case "chat:bridge-connected":
        break;
    }
  }

  window.addEventListener("message", (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || !ws || ws.readyState !== WebSocket.OPEN) return;
    // Result of a figma_* command executed on behalf of an external session.
    ws.send(JSON.stringify(msg));
  });

  function send() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN || waitingForReply) return;
    bubble("user", text);
    inputEl.value = "";
    setWaiting(true);
    ws.send(JSON.stringify({ type: "chat:send", text }));
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  connect();

  window.addEventListener("beforeunload", () => {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    if (ws) ws.close();
  });
})();
</script>

<script>
(function () {
  // Runs figma-console-mcp's Desktop Bridge plugin (vendored, unmodified,
  // MIT-licensed, from https://github.com/southleft/figma-console-mcp) in a
  // hidden nested iframe, so its port-scanning WebSocket client (ports
  // 9223-9232) is always running alongside this plugin's own chat UI — no
  // second plugin needs to be opened/focused in Figma.
  //
  // The nested iframe's `parent` is THIS window, not Figma's real host, so
  // its `parent.postMessage({pluginMessage},'*')` calls land here instead of
  // reaching src/code.ts directly. This listener relays in both directions:
  // messages from the nested iframe go up to the real parent (code.ts), and
  // messages from the real parent are echoed down into the nested iframe.
  const html = atob("__DESKTOP_BRIDGE_UI_B64__");
  const bridgeIframe = document.createElement("iframe");
  bridgeIframe.style.display = "none";
  bridgeIframe.srcdoc = html;
  document.body.appendChild(bridgeIframe);

  window.addEventListener("message", (event) => {
    if (!event.data || !event.data.pluginMessage) return;
    if (event.source === bridgeIframe.contentWindow) {
      parent.postMessage(event.data, "*");
    } else if (bridgeIframe.contentWindow) {
      bridgeIframe.contentWindow.postMessage(event.data, "*");
    }
  });
})();
</script>

</body>
</html>
